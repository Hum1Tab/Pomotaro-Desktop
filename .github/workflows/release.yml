name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pomotaro __VERSION__'
          releaseBody: |
            ## Pomotaro v__VERSION__

            Your AI assistant can now drive the timer.

            ### Highlights
            - **Opt-in local agent bridge.** Settings → AI Agent Integration starts a
              `127.0.0.1`-only HTTP API. Read the timer or start, pause, reset and switch
              sessions from Claude Code, Codex, Cursor or any tool that can call HTTP.
            - **Portable `SKILL.md`.** Drop `skill/pomotaro/` into `.claude/skills/` and the
              agent knows how to find `%APPDATA%\com.pomotaro.app\bridge.json`, authenticate
              and poll for state.
            - **Secure by default.** Loopback only, a bearer token regenerated on every
              launch, browser `Origin` requests rejected, `Host` validated, and the bridge
              stops (and deletes its descriptor) when you turn it off or quit the app.
            - **Rust unit tests** cover token comparison, Host validation and request parsing.

            ### Also in this release
            - Everything from [v2.1.0](https://github.com/Hum1Tab/Pomotaro-Desktop/releases/tag/v2.1.0):
              app-wide language switching, the window-title timer, roughly half the initial
              JavaScript, accessibility fixes and a Content Security Policy.

            ### Install
            Download the Windows installer below. Windows 10/11 (x64) is supported.
            Auto-updates are signed; v2.0.0 and v2.1.0 installs receive this version automatically.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
