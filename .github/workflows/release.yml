name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pomotaro __VERSION__'
          releaseBody: |
            ## Pomotaro v__VERSION__

            A quality-focused release: faster startup, correct language switching, and the
            window-title timer that v2.0.0 promised but never wired up.

            ### Highlights
            - **Language switching now works everywhere.** The setting was stored per
              component, so the rest of the UI kept the old language until restart.
            - **Remaining time in the window title.** Visible from the taskbar while the
              window is in the background.
            - **Faster first paint.** Stats, calendar, settings and the stopwatch are loaded
              on demand; the initial JavaScript payload is roughly halved.
            - **Less background work.** Timer snapshots and Discord Rich Presence are no
              longer rewritten every second.
            - **Accessibility.** Visible keyboard focus, ARIA labels on icon-only buttons,
              and support for the OS "reduce motion" setting.
            - **Security.** A Content Security Policy is now enforced in production.

            ### Install
            Download the Windows installer below. Windows 10/11 (x64) is supported.
            Auto-updates are signed; v2.0.0 installs receive this version automatically.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
